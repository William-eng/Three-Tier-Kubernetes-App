
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "ubuntu-server"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "alloy"
    static_configs:
      - targets: ["alloy:8080"]    
