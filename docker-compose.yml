services:

  frontend:
    build:
      context: ./frontend

    container_name: task-manager-frontend

    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=8000

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped


  backend:
    build:
      context: ./backend

    container_name: task-manager-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    depends_on:
      mysql:
        condition: service_healthy


    restart: unless-stopped


  mysql:
    image: mysql:8

    container_name: task-manager-mysql

    ports:
      - "3306:3306"

    env_file:
      - .env.db

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: task-manager-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: task-manager-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    pid: host
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.3
    container_name: task-manager-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: task-manager-alloy
    command:
      - run
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    container_name: task-manager-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

